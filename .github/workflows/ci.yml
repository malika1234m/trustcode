name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install
        run: |
          python -m pip install -r backend/requirements-dev.txt -e verification-worker
      - name: Build sandbox image
        run: docker build -t trustcode-sandbox:0.1 verification-worker/trustcode_worker/sandbox/image
      - name: Validate Semgrep rules
        run: semgrep --metrics=off --validate --config verification-worker/trustcode_worker/rules/
      - name: Worker tests
        run: python -m pytest verification-worker/tests -q
      - name: Backend tests
        run: cd backend && python -m pytest tests -q
      - name: Migrations apply cleanly
        run: cd backend && TRUSTCODE_DATABASE_URL=sqlite:///./ci.db alembic upgrade head && alembic downgrade base
      - name: Benchmark validation
        run: python scripts/dataset_validation/build_benchmark.py
      - name: Lint
        run: ruff check backend/app verification-worker/trustcode_worker --select E9,F
  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci || npm install
      - run: npm test
      - run: npx vsce package --no-dependencies
