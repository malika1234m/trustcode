# Local / single-host deployment: PostgreSQL + API + worker. See deployment/README.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustcode
      POSTGRES_USER: trustcode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U trustcode"], interval: 5s, retries: 10 }
    # no published port: the database is reachable only on the internal network
  api:
    build: { context: ., dockerfile: deployment/docker/Dockerfile.api }
    env_file: .env
    environment:
      TRUSTCODE_DATABASE_URL: postgresql+psycopg2://trustcode:${POSTGRES_PASSWORD}@db:5432/trustcode
      TRUSTCODE_WORKER_MODE: queue
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  worker:
    build: { context: ., dockerfile: deployment/docker/Dockerfile.worker }
    env_file: .env
    environment:
      TRUSTCODE_DATABASE_URL: postgresql+psycopg2://trustcode:${POSTGRES_PASSWORD}@db:5432/trustcode
      TRUSTCODE_WORKER_MODE: queue
      TRUSTCODE_SANDBOX_IMAGE: trustcode-sandbox:0.1
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]  # needed to start sandbox containers (threat T-9)
    depends_on: { db: { condition: service_healthy }, api: { condition: service_started } }
    security_opt: [no-new-privileges:true]
  sandbox-image:
    build: { context: verification-worker/trustcode_worker/sandbox/image }
    image: trustcode-sandbox:0.1
    entrypoint: ["true"]
    profiles: [build]
volumes:
  pgdata:
